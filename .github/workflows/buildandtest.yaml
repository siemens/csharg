name: 'build and test'

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - develop
permissions:
  contents: read

jobs:

  buildandtest:
    name: Build and Test on Go ${{matrix.go}}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: [ 'stable', 'oldstable' ]

    steps:
      - name: Set up Go ${{matrix.go}}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{matrix.go}}
        id: go

      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test Go packages
        run: go test -v -p 1 ./...

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest

    steps:
      - name: Set up Go stable
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tshark
        run: sudo bash .devcontainer/tshark/install.sh

      - name: Run end-to-end tests
        run: make e2e

  windowspipe:
    # Only the pipe package is Windows-specific; other packages may not build on Windows.
    name: Test pipe package on Windows
    runs-on: windows-latest

    steps:
      - name: Set up Go stable
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test pipe package
        run: go test -v ./pipe/...
